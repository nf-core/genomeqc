name: "mmseqs_easylinclust"
description: Clusters sequences with MMseqs2 easy-linclust and keeps one
  representative sequence per cluster
keywords:
  - clustering
  - mmseqs2
  - repeat library
  - deduplication
tools:
  - "mmseqs2":
      description: "MMseqs2 (Many-against-Many sequence searching) is a software suite
        to search and cluster huge protein and nucleotide sequence sets."
      homepage: "https://github.com/soedinglab/MMseqs2"
      documentation: "https://github.com/soedinglab/MMseqs2/wiki"
      tool_dev_url: "https://github.com/soedinglab/MMseqs2"
      doi: "10.1038/nbt.3988"
      licence:
        - "GPL v3"
      identifier: "biotools:mmseqs2"
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test' ]
    - fasta:
        type: file
        description: FASTA file of sequences to cluster (e.g. a combined repeat
          library)
        pattern: "*.{fa,fasta,fna}"
        ontologies: []
output:
  representatives:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test' ]
      - "*_rep_seq.fasta":
          type: file
          description: FASTA of one representative sequence per cluster
          pattern: "*_rep_seq.fasta"
          ontologies: []
  versions_mmseqs:
    - - ${task.process}:
          type: string
          description: The name of the process
      - mmseqs:
          type: string
          description: The name of the tool
      - mmseqs version:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - mmseqs:
          type: string
          description: The name of the tool
      - mmseqs version:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@chriswyatt1"
maintainers:
  - "@chriswyatt1"
